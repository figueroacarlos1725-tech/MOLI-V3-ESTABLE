services:
  qa-mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - moli_qa_mongo:/data/db
    networks:
      - moli_qa

  backend:
    build:
      context: ../..
      dockerfile: deploy/qa/backend.Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://qa-mongo:27017
      DB_NAME: moli_qa
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      OTP_SECRET: ${OTP_SECRET:-}
      WHATSAPP_OTP_SEND_URL: ${WHATSAPP_OTP_SEND_URL:-}
      WHATSAPP_OTP_API_KEY: ${WHATSAPP_OTP_API_KEY:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-moli_registration_code}
      WHATSAPP_INTEGRATION_API_KEY: ${WHATSAPP_INTEGRATION_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      BACKEND_URL: ${BACKEND_URL:-http://95.111.238.35/moli-qa}
    depends_on:
      - qa-mongo
    networks:
      - moli_qa
      - moli-bot_moli-net

  frontend:
    build:
      context: ../..
      dockerfile: deploy/qa/frontend.Dockerfile
      args:
        EXPO_PUBLIC_BACKEND_URL: ${EXPO_PUBLIC_BACKEND_URL:-http://95.111.238.35/moli-qa}
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      - backend
    networks:
      - moli_qa

networks:
  moli_qa:
  moli-bot_moli-net:
    external: true

volumes:
  moli_qa_mongo:
