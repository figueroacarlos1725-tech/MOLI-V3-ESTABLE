<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <script src="/vendor/leaflet/leaflet.js"></script>
  <style>
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;background:#f1efed}
    .leaflet-div-icon{background:none!important;border:0!important}
    .vehicle-frame{width:54px;height:54px;display:grid;place-items:center;background:transparent}
    .vehicle{width:var(--vehicle-size,36px);height:var(--vehicle-size,36px);object-fit:contain;filter:drop-shadow(0 3px 3px rgba(45,24,15,.34));transition:width .18s ease,height .18s ease}
    .pin{position:relative;width:28px;height:28px;border:3px solid #fff;border-radius:50% 50% 50% 0;box-shadow:0 4px 10px rgba(62,30,14,.32);transform:rotate(-45deg)}
    .pin:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
    .pin.pickup{background:#ff5a1f}.pin.dropoff{background:#202124}
    .leaflet-control-zoom{border:0!important;box-shadow:0 5px 14px rgba(62,30,14,.16)!important}
    .leaflet-control-zoom a{color:#ff5a1f!important;border-color:#f5e4da!important}
    .leaflet-control-attribution{font-size:9px!important;opacity:.65}
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map=L.map('map',{zoomControl:true,attributionControl:true}).setView([-28.4696,-65.7852],14);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    let markers=[];
    let route=null;
    let clickEnabled=false;

    const send=data=>window.parent.postMessage(JSON.stringify(data),'*');
    const iconFor=m=>{
      if(m.type==='driver'){
        const src=m.vehicleType==='moto'?'/vehicles/map-moto-moli.png':'/vehicles/map-car-moli.png';
        return L.divIcon({className:'leaflet-div-icon',html:`<div class="vehicle-frame"><img class="vehicle" src="${src}" alt=""></div>`,iconSize:[54,54],iconAnchor:[27,27]});
      }
      const kind=m.type==='dropoff'?'dropoff':'pickup';
      return L.divIcon({className:'leaflet-div-icon',html:`<div class="pin ${kind}"></div>`,iconSize:[28,28],iconAnchor:[14,28]});
    };

    function resizeVehicles(){
      const zoom=map.getZoom();
      const size=zoom<=12?20:zoom===13?25:zoom===14?31:zoom===15?37:zoom===16?43:48;
      document.documentElement.style.setProperty('--vehicle-size',`${size}px`);
    }
    map.on('zoomend',resizeVehicles);
    resizeVehicles();

    function render(items,showRoute){
      markers.forEach(marker=>map.removeLayer(marker));
      markers=[];
      if(route){map.removeLayer(route);route=null}
      const bounds=L.latLngBounds([]);
      (items||[]).forEach(item=>{
        const marker=L.marker([item.latitude,item.longitude],{icon:iconFor(item),draggable:!!item.draggable}).addTo(map);
        if(item.title)marker.bindTooltip(item.title,{direction:'top',offset:[0,-20]});
        if(item.draggable)marker.on('dragend',event=>{
          const point=event.target.getLatLng();
          send({type:'markerDrag',markerType:item.type||'',latitude:point.lat,longitude:point.lng});
        });
        markers.push(marker);
        bounds.extend([item.latitude,item.longitude]);
      });
      const pickup=(items||[]).find(item=>item.type==='pickup');
      const dropoff=(items||[]).find(item=>item.type==='dropoff');
      if(showRoute&&pickup&&dropoff){
        route=L.polyline([[pickup.latitude,pickup.longitude],[dropoff.latitude,dropoff.longitude]],{color:'#ff5a1f',weight:5,opacity:.9,dashArray:'2 9',lineCap:'round'}).addTo(map);
      }
      if(bounds.isValid())map.fitBounds(bounds,{padding:[54,38],maxZoom:15});
      setTimeout(()=>map.invalidateSize(),80);
    }

    map.on('click',event=>{
      if(clickEnabled)send({type:'mapPress',latitude:event.latlng.lat,longitude:event.latlng.lng});
    });

    window.addEventListener('message',event=>{
      const data=typeof event.data==='string'?JSON.parse(event.data):event.data;
      if(data?.type==='init'){
        clickEnabled=!!data.enableClick;
        map.setView([data.latitude||-28.4696,data.longitude||-65.7852],14);
        render(data.markers,data.showRoute);
      }else if(data?.type==='markers'){
        render(data.markers,data.showRoute);
      }
    });
    send({type:'mapReady'});
  </script>
</body>
</html>
